name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build mobile web bundle
        env:
          VITE_SUPABASE_URL: https://iqaawaweihvcapzwiecf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_APhdwg2MR03wLBdDu4FN2Q_GNjI2X2S
        run: npm run build:mobile

      - name: Generate Android project
        run: npx cap add android

      - name: Stamp Android version
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Veira-debug-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veira-Android-debug-${{ github.run_number }}
          path: Veira-debug-${{ github.run_number }}.apk
          if-no-files-found: error
